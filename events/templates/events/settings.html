{% extends 'events/base.html' %}

{% block title %}{{ t.page_settings }}{% endblock %}

{% block content %}
<h1>⚙️ {{ t.page_settings }}</h1>

<form method="post" class="settings-form">
    {% csrf_token %}

    <div class="form-group">
        <label>{{ t.theme_label }}</label>
        {{ form.theme }}
    </div>

    <div class="form-group">
        <label>{{ t.language_label }}</label>
        {{ form.language }}
    </div>

    <div class="form-group">
        <label>{{ t.email_label }}</label>
        {{ form.notification_email }}
    </div>

    <div class="form-group">
        <label>{{ t.notify_before_label }}</label>
        {{ form.notify_before }}
    </div>

    <button type="submit" class="btn">{{ t.save_settings }}</button>
</form>

<p class="hint">{{ t.settings_hint }}</p>
{% endblock %}
